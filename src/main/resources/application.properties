spring.application.name=chatbot
server.port=8888
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# Boot 4.0 Jackson 3 전환: 기존(Jackson 2) 직렬화 기본값 유지하여 API/게이트웨이 계약 보존
spring.jackson.use-jackson2-defaults=true

logging.config=classpath:logback-chatbot.xml

ultari.ai.temp.path=D:\\projects\\chatbot\\tmp

# === 임시파일 정리 스케줄러 (ultari.ai.temp.path 하위) ===
# 보존시간 지난 파일 삭제 + 빈 디렉터리 정리. dialog CSV 누적분·attach 릴레이 실패 orphan 청소용.
ultari.ai.temp.cleanup.enabled=true
ultari.ai.temp.cleanup.retention-hours=24
ultari.ai.temp.cleanup.cron=0 30 3 * * *

# === 업로드 문서 보관 (PDF 페이지 보기용). temp와 분리된 별도 디렉터리 + 긴 보존기간 ===
# 챗봇에 올린 PDF는 여기에 저장되고, temp(24h)와 달리 아래 보존시간(기본 7일=168h)으로 관리된다.
# 권장: 게이트웨이 개인 업로드 TTL과 맞출 것.
ultari.ai.document.path=D:\\projects\\chatbot\\documents
ultari.ai.document.cleanup.retention-hours=168

# === 신규 재구성(4.x) 게이트웨이/부서 설정 ===
# AI 서버 base URL (부서 prefix 이전). 실제 요청은 base-url + /{dept} + path 로 조립.
ultari.ai-gateway.base-url=http://10.0.0.31:8000
ultari.ai-gateway.connect-timeout-ms=3000

# SSE 응답 타임아웃(ms). 게이트웨이가 완료 주체이므로 넉넉히(기본 30분).
# 대용량 문서 인제스트(AI 분석)/장문 답변이 이 시간을 넘기면 우리 쪽에서 스트림을 끊는다.
# 0 이하이면 무제한(게이트웨이 완료/브라우저 종료로만 종료).
ultari.sse.timeout-ms=1800000

# AI 파티션(dept) 권한: 앱 AI_DEPT_GRANT(조직/사용자 부여)로 결정, 미허용/미지정은 default-dept.
# codes는 관리자 'AI 파티션 권한' 화면의 dept 탭 목록.
ultari.dept.default-dept=dept-a
ultari.dept.codes=dept-a,dept-b
# 조직도 부모맵(msg_part) 캐시 TTL(초). 챗봇 진입/요청마다 인사DB 전체조회 방지. 0 이하면 캐시 끔.
ultari.dept.part-cache-ttl-seconds=300

# === 관리자 통계: 항목별 표시 여부 (false면 통계 화면·엑셀에서 제외) ===
ultari.statistics.audio-enabled=false
ultari.statistics.template-enabled=false

# === 챗봇 하단 도구 메뉴 노출 제어 (서버 환경설정 전용) ===
# false면 해당 버튼을 렌더에서 제외. 미설정 시 전부 노출(true).
ultari.chatbot.menu.upload=true
ultari.chatbot.menu.docs=true
ultari.chatbot.menu.template=false
ultari.chatbot.menu.translate=false
ultari.chatbot.menu.pkb=true

# === 잔존 구 게이트웨이 URL ===
# upload-url : AIRelayService.uploadFile (메신저 첨부 사전등록 /chatbot/file/upload)
ultari.ai-gateway.upload-url=http://10.0.0.31:8000/upload

ultari.interface-summary.url=http://10.0.0.151:8888/chatbot/summary

# === /chatbot/attach 관대 멀티파트 파싱(임시) ===
# true면 attach 경로만 서블릿(Tomcat) 멀티파트 파싱을 건너뛰고 자체 파서로 처리(LF/CRLF 모두 허용).
# 클라이언트가 bare LF 멀티파트를 보내 MaxUploadSizeExceeded(413)가 나는 경우 임시 우회용.
# false(원복)면 표준 파싱만 사용. 다른 경로/엔드포인트는 값과 무관하게 항상 표준.
ultari.chatbot.attach.lenient-multipart=true

# === 챗봇 진입 URL(/chatbot/{key}) 사용자ID 암호화 로그인 ===
# 클라이언트가 'USER_ID|yyyyMMddHHmmss'를 AES-256-CBC(Base64)로 암호화해 전달, 서버가 복호화·
# 시각검증(한국시간 ±window) 후 진입 허용.
#  - true(엄격): 암호화 토큰만 허용(평문 아이디 접근 차단).
#  - false(호환): 평문 아이디와 암호화 토큰을 모두 허용(전환기용, 기본).
# 클라이언트는 URL 경로 안전을 위해 URL-safe Base64(-,_) 로 인코딩할 것.
ultari.chatbot.login.encrypt-enabled=false
ultari.chatbot.login.encrypt-key=MMAA_AICHATBOT_SECRET_KEY_ULTARI
ultari.chatbot.login.encrypt-iv=MMAA_AICHATBOTIV
ultari.chatbot.login.encrypt-window-seconds=300


