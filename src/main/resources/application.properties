spring.application.name=chatbot
server.port=8888
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Boot 4.0 Jackson 3 전환: 기존(Jackson 2) 직렬화 기본값 유지하여 API/게이트웨이 계약 보존
spring.jackson.use-jackson2-defaults=true

logging.config=classpath:logback-chatbot.xml

ultari.ai.temp.path=D:\\projects\\chatbot\\tmp

# === 신규 재구성(4.x) 게이트웨이/부서 설정 ===
# AI 서버 base URL (부서 prefix 이전). 실제 요청은 base-url + /{dept} + path 로 조립.
ultari.ai-gateway.base-url=http://10.0.0.31:8000
ultari.ai-gateway.connect-timeout-ms=3000

# SSE 응답 타임아웃(ms). 게이트웨이가 완료 주체이므로 넉넉히(기본 30분).
# 대용량 문서 인제스트(AI 분석)/장문 답변이 이 시간을 넘기면 우리 쪽에서 스트림을 끊는다.
# 0 이하이면 무제한(게이트웨이 완료/브라우저 종료로만 종료).
ultari.sse.timeout-ms=1800000

# AI 파티션(dept) 권한: 앱 AI_DEPT_GRANT(조직/사용자 부여)로 결정, 미허용/미지정은 default-dept.
# codes는 관리자 'AI 파티션 권한' 화면의 dept 탭 목록.
ultari.dept.default-dept=dept-a
ultari.dept.codes=dept-a,dept-b

# === 관리자 통계: '통화요약' 표시 여부 (통화요약 미사용 납품처는 false) ===
ultari.statistics.audio-enabled=false

# === 챗봇 하단 도구 메뉴 노출 제어 (서버 환경설정 전용) ===
# false면 해당 버튼을 렌더에서 제외. 미설정 시 전부 노출(true).
ultari.chatbot.menu.upload=true
ultari.chatbot.menu.docs=true
ultari.chatbot.menu.template=false
ultari.chatbot.menu.translate=false
ultari.chatbot.menu.pkb=true

# === 잔존 구 게이트웨이 URL ===
# upload-url : AIRelayService.uploadFile (메신저 첨부 사전등록 /chatbot/file/upload)
ultari.ai-gateway.upload-url=http://10.0.0.31:8000/upload

ultari.interface-summary.url=http://10.0.0.151:8888/chatbot/summary


#DB vendor : 파티션 전략 선택 (mysql | oracle)
ultari.db.vendor=mysql

