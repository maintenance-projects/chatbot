spring.application.name=chatbot
server.port=8888
# HttpSession 타임아웃. 미설정 시 톰캣 기본 30분이라 관리자 세션(60분)보다 먼저 만료됨 → 3600s로 정렬.
server.servlet.session.timeout=3600s
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# 요청/응답 인코딩 UTF-8 강제 (multipart form field 한글 깨짐 방지)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Boot 4.0 Jackson 3 전환: Jackson 2 직렬화 기본값 유지(게이트웨이 계약 보존)
spring.jackson.use-jackson2-defaults=true

logging.config=classpath:logback-chatbot.xml

ultari.ai.temp.path=D:\\projects\\chatbot\\tmp

# === 임시파일 정리 스케줄러 (ultari.ai.temp.path 하위) ===
# 보존시간 지난 파일 + 빈 디렉터리 정리 (dialog CSV·attach 실패 orphan 청소)
ultari.ai.temp.cleanup.enabled=true
ultari.ai.temp.cleanup.retention-hours=24
ultari.ai.temp.cleanup.cron=0 30 3 * * *

# === 업로드 PDF 미리보기 사본 저장소 (temp와 분리) ===
# 보존기간은 게이트웨이 file_ttl_days + 1일로 동적 결정. 아래 정적값은 미사용(폴백 168h만 코드 유지).
ultari.ai.document.path=D:\\projects\\chatbot\\documents
#ultari.ai.document.cleanup.retention-hours=168

# === 4.x 게이트웨이/부서 설정 ===
# AI 서버 base URL. 실제 요청 = base-url + /{dept} + path
ultari.ai-gateway.base-url=http://10.0.0.31:8888
ultari.ai-gateway.connect-timeout-ms=3000

# SSE 응답 타임아웃(ms). 게이트웨이가 완료 주체라 넉넉히(기본 30분). 0 이하면 무제한.
ultari.sse.timeout-ms=1800000

# 벡터DB(dept)는 dept-a 단일 고정. 접근 통제는 파티션 권한(AI_PARTITION_GRANT)으로만. (AI_DEPT_GRANT는 dormant)
ultari.dept.default-dept=dept-a
ultari.dept.codes=dept-a
# 조직도 부모맵(msg_part) 캐시 TTL(초). 요청마다 인사DB 전체조회 방지. 0 이하면 끔.
ultari.dept.part-cache-ttl-seconds=300
# dept 접근권한 캐시 TTL(초). 관리자 권한 부여/회수 시 즉시 무효화. 0 이하면 끔.
ultari.dept.grant-cache-ttl-seconds=300
# === HR 디렉터리 인메모리 스냅샷 ===
# 전체 사용자(이름·비번·부서)를 주기 배치로 메모리 적재 → 접속/로그인/부서해석은 메모리에서. 미적재 시에만 DB 폴백.
ultari.hr.directory.enabled=true
# 갱신 주기(ms, 기본 1시간). 기동 시 워밍업 1회 후 주기 갱신.
ultari.hr.directory.refresh-ms=3600000

# === 관리자 통계: 항목별 표시 여부 (false면 통계·엑셀에서 제외) ===
ultari.statistics.audio-enabled=false
ultari.statistics.template-enabled=false
# 첨부파일검색(PKB) 탭 숨김에 맞춰 제외. 되살리려면 true.
ultari.statistics.pkb-enabled=false

# === GPU 모니터링(관리자) — 같은 호스트의 nvidia-smi 실행 ===
# GPU 없으면 자동 '미탐지'(앱 영향 없음). false면 메뉴/기능 숨김.
ultari.admin.gpu.enabled=true
# nvidia-smi 경로(PATH에 없거나 커스텀 설치 시 절대경로 지정)
ultari.admin.gpu.nvidia-smi-path=nvidia-smi
ultari.admin.gpu.exec-timeout-ms=5000
# 이력 수집(시계열, 증설 판단용). 15초 간격·31일 보존.
ultari.admin.gpu.history.enabled=true
ultari.admin.gpu.history.interval-ms=15000
ultari.admin.gpu.history.retention-days=31
# 임계 경고(배너+로그). 기본 메모리·전력 90%, 이용률 90% 5분 지속 시. cooldown-min: 동일 경고 재기록 최소 간격.
ultari.admin.gpu.alert.enabled=true
ultari.admin.gpu.alert.mem-threshold=90
ultari.admin.gpu.alert.power-threshold=90
# 이용률(util) 경고는 기본 OFF: 추론만 돌아도 100%라 노이즈. 부족 신호는 메모리·전력으로 판단.
ultari.admin.gpu.alert.util-enabled=false
ultari.admin.gpu.alert.util-threshold=90
ultari.admin.gpu.alert.util-sustain-min=5
ultari.admin.gpu.alert.cooldown-min=10

# === 챗봇 하단 도구 메뉴 노출 (false면 버튼 제외, 미설정 시 전부 노출) ===
ultari.chatbot.menu.upload=true
ultari.chatbot.menu.docs=true
ultari.chatbot.menu.template=true
ultari.chatbot.menu.translate=true
# AI 첨부파일 검색 탭. false면 탭·pane·pkb 리소스 모두 미렌더(현재 숨김).
ultari.chatbot.menu.pkb=true

# === 구 게이트웨이 URL ===
# upload-url: AIRelayService.uploadFile (메신저 첨부 사전등록 /chatbot/file/upload)
ultari.ai-gateway.upload-url=http://10.0.0.31:8888/upload

ultari.interface-summary.url=http://10.0.0.151:8888/chatbot/summary

# === /chatbot/attach 관대 멀티파트 파싱(임시) ===
# true면 attach 경로만 자체 파서로 처리(LF/CRLF 허용). bare LF로 413 날 때 임시 우회. false면 표준 파싱.
ultari.chatbot.attach.lenient-multipart=true

# === 챗봇 진입 암호화 로그인 (/chatbot/{key}) ===
# 'USER_ID|yyyyMMddHHmmss'를 AES-256-CBC(Base64)로 암호화 전달 → 서버가 복호화·시각검증(KST ±window).
#  true=암호화 토큰만 허용(엄격, 평문 차단), false=평문+토큰 모두 허용(호환).
# 클라이언트는 URL 경로 안전을 위해 URL-safe Base64(-,_) 사용.
ultari.chatbot.login.encrypt-enabled=false
ultari.chatbot.login.encrypt-key=MMAA_AICHATBOT_SECRET_KEY_ULTARI
ultari.chatbot.login.encrypt-iv=MMAA_AICHATBOTIV
ultari.chatbot.login.encrypt-window-seconds=300
# 일회용 토큰: 사용된 토큰은 시간창 안이어도 재사용 거부(리플레이 방지). encrypt-enabled=true일 때만 발효. 단일 인스턴스 전제.
ultari.chatbot.login.one-time=true


# DB vendor: 파티션 전략 선택 (mysql | oracle)
ultari.db.vendor=mysql

# DB (MySQL)
spring.datasource.url=jdbc:mysql://125.131.105.208:5506/mmaa-ai?characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Seoul
spring.datasource.username=msger
spring.datasource.password=ultari12#$
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 종료 시 진행 중 요청 마무리 후 커넥션 풀 정상 반납(강제 종료 시 DB 유령 커넥션 방지).
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# === 인사(HR) DB — 조회 전용(MyBatis). 앱은 쓰지 않음. msg_user/msg_part ===
hr.datasource.url=jdbc:mysql://10.0.0.151:3306/mmaa?characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Seoul
hr.datasource.username=msger
hr.datasource.password=msger
hr.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# HR 풀 워밍업(원격 DB 첫 커넥션 지연 완화). keepalive-time: 유휴 커넥션 끊김 방지(max-lifetime보다 작게).
hr.datasource.hikari.minimum-idle=0
hr.datasource.hikari.maximum-pool-size=2
hr.datasource.hikari.connection-timeout=10000
hr.datasource.hikari.max-lifetime=1800000
hr.datasource.hikari.keepalive-time=120000
# 공유 인사DB 상시 유휴 커넥션 축소: 유휴 30s 초과분 반납. 'Too many connections' 완화.
hr.datasource.hikari.idle-timeout=30000

# HR 매퍼(SQL) XML 위치. 기본은 jar 내부(classpath). 납품 서버에서 리빌드 없이 쿼리를 고치려면
# 외부 경로로 바꾸고 <배포폴더>/config/mapper/hr/*.xml 수정 후 재시작(기동 시 1회 로드).
#hr.mapper.locations=file:./config/mapper/hr/*.xml

# DB (Oracle) — 오라클 납품 시 위 MySQL 블록을 주석 처리하고 아래 사용 + ultari.db.vendor=oracle
#ultari.db.vendor=oracle
#spring.datasource.url=jdbc:oracle:thin:@//HOST:1521/SERVICE
#spring.datasource.username=CHATBOT
#spring.datasource.password=CHANGE_ME
#spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
#spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=1800000
# 원격/방화벽 환경 유휴 커넥션 끊김 방지(AI_DEPT_GRANT 등 조회 첫 쿼리 지연 완화)
spring.datasource.hikari.keepalive-time=120000

# === 정적 리소스 gzip 압축: JS/CSS 전송량 대폭 감소(예: dialog.js 107KB→~30KB) ===
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/plain,text/javascript,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024
