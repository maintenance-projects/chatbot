spring.application.name=chatbot
server.port=8888
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Boot 4.0 Jackson 3 전환: 기존(Jackson 2) 직렬화 기본값 유지하여 API/게이트웨이 계약 보존
spring.jackson.use-jackson2-defaults=true

logging.config=classpath:logback-chatbot.xml

ultari.ai.temp.path=D:\\projects\\chatbot\\tmp

# === 신규 재구성(4.x) 게이트웨이/부서 설정 ===
# AI 서버 base URL (부서 prefix 이전). 실제 요청은 base-url + /{dept} + path 로 조립.
ultari.ai-gateway.base-url=http://10.0.0.31:8000
ultari.ai-gateway.connect-timeout-ms=3000

# 부서 라우팅: 로그인 아이디 → 부서코드 매핑(테이블 변경 없이 멀티부서 대응).
# 매핑에 없는 사용자는 default-dept 적용. 향후 JWT 전환 시 토큰 추출로 대체.
ultari.dept.default-dept=dept-a
#ultari.dept.mapping.alice=dept-a
#ultari.dept.mapping.bob=dept-b

# === 기존(3.x) 게이트웨이 URL (Phase 1에서 신규 경로로 대체 예정) ===
ultari.ai-gateway.chat-private-url=http://10.0.0.31:8000/message/private
ultari.ai-gateway.chat-open-url=http://10.0.0.31:8000/message/open
ultari.ai-gateway.chat-default-url=http://10.0.0.31:8000/message
ultari.ai-gateway.upload-url=http://10.0.0.31:8000/upload
ultari.ai-gateway.files-url=http://10.0.0.31:8000/files
ultari.ai-gateway.template-url=http://10.0.0.31:8000/documents/generate-hwpx
ultari.ai-gateway.call-summary-url=http://10.0.0.31:8000/call-summary
ultari.ai-gateway.doc-summary-url=http://10.0.0.31:8000/message/document-summary
ultari.ai-gateway.dialog-summary-url=http://10.0.0.31:8000/convert/dialogue-summary
ultari.ai-gateway.download-url=http://10.0.0.31:8000/documents/download
ultari.ai-gateway.meeting-template-url=http://10.0.0.31:8000/documents/meeting-minutes/generate-from-text

ultari.interface-summary.url=http://10.0.0.151:8888/chatbot/summary


