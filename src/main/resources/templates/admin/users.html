<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 페이지 · 사용자 부서</title>
    <link rel="stylesheet" th:href="@{/css/admin/base.css}" href="/css/admin/base.css" />
    <link rel="stylesheet" th:href="@{/css/admin/master.css}" href="/css/admin/master.css" />
    <script th:inline="javascript">
        window.deptCodes = /*[[${deptCodes}]]*/ [];
        window.adminName = /*[[${adminName}]]*/ "";
    </script>
    <style>
        .dept-tabs { display: flex; gap: 6px; border-bottom: 2px solid #e5e7eb; margin-bottom: 14px; }
        .dept-tab { padding: 9px 20px; border: none; background: none; cursor: pointer; font-size: 14px;
            font-weight: 600; color: #6b7280; border-bottom: 2px solid transparent; margin-bottom: -2px; }
        .dept-tab.active { color: #2563eb; border-bottom-color: #2563eb; }
        .tree-toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
        .tree-toolbar .search-input { max-width: 260px; }
        .tree { font-size: 14px; }
        .tree ul { list-style: none; margin: 0; padding-left: 22px; }
        .tree > ul { padding-left: 0; }
        .tnode { display: flex; align-items: center; gap: 7px; padding: 3px 4px; border-radius: 6px; }
        .tnode:hover { background: #f3f4f6; }
        .tnode.hidden { display: none; }
        .tw-toggle { width: 16px; text-align: center; cursor: pointer; color: #9ca3af; user-select: none; }
        .tw-toggle.leaf { visibility: hidden; }
        .tnode input[type=checkbox] { width: 16px; height: 16px; cursor: pointer; }
        .tnode .tlabel { cursor: default; }
        .tnode.part .tlabel { font-weight: 600; }
        .tnode.user .tlabel { color: #374151; }
        .tnode .tsub { color: #9ca3af; font-size: 12px; }
        .tnode .tbadge { font-size: 11px; padding: 1px 6px; border-radius: 9px; background: #ede9fe; color: #6d28d9; }
        .tnode .tbadge.deny { background: #fee2e2; color: #b91c1c; }
        .collapsed > ul { display: none; }
    </style>
</head>

<body>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="admin-wrapper">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="#" class="sidebar-logo">
                    <div class="sidebar-logo-icon">AT-I</div>
                    <span class="sidebar-logo-text">관리자 페이지</span>
                </a>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section-title">메뉴</div>
                <a th:if="${storage}" href="/admin/storage" class="nav-item" data-page="storage">문서 관리</a>
                <a th:if="${statistics}" href="/admin/statistics" class="nav-item" data-page="statistics">통계</a>
                <a th:if="${master}" href="/admin/master" class="nav-item" data-page="master">계정 관리</a>
                <a th:if="${master}" href="/admin/users" class="nav-item active" data-page="users">사용자 부서</a>
                <a href="/admin/guide" class="nav-item" data-page="guide">가이드</a>
            </nav>
            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <div class="sidebar-user-avatar" id="userAvatar">A</div>
                    <div class="sidebar-user-info">
                        <div class="sidebar-user-name" id="userName">admin</div>
                        <div class="sidebar-user-role" th:text="${adminName}">관리자</div>
                    </div>
                    <button class="btn-change-pw" id="btnChangePw" title="비밀번호 변경">🔑</button>
                    <button class="btn-logout" id="btnLogout" title="로그아웃">⏻</button>
                </div>
            </div>
        </aside>

        <div class="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="btn-sidebar-toggle" id="btnSidebarToggle">≡</button>
                    <div class="breadcrumb">
                        <a href="#">홈</a><span class="breadcrumb-sep">›</span>
                        <span class="breadcrumb-current">사용자 부서</span>
                    </div>
                </div>
                <div class="topbar-right">
                    <div class="session-timer">
                        <span class="session-timer-label">세션 만료까지</span>
                        <span class="session-timer-value" id="sessionTimer"
                            th:attr="data-remaining=${sessionRemainingSeconds}" data-remaining="0">00:00:00</span>
                        <span class="session-timer-note" id="sessionTimerNote"></span>
                        <button type="button" class="session-timer-refresh" id="sessionTimerRefresh">연장</button>
                    </div>
                </div>
            </header>

            <main class="page-body">
                <section class="table-card" style="position:relative;">
                    <div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div></div>

                    <!-- dept 탭 -->
                    <div class="dept-tabs" id="deptTabs"></div>

                    <div class="tree-toolbar">
                        <input type="text" class="search-input" id="treeSearch" placeholder="이름/아이디 검색…">
                        <button class="btn btn-outline btn-sm" id="btnExpandAll" type="button">모두 펼치기</button>
                        <button class="btn btn-outline btn-sm" id="btnCollapseAll" type="button">모두 접기</button>
                        <span style="flex:1"></span>
                        <span class="tsub" id="treeHint">조직·사용자에 체크하면 해당 부서 접근 권한이 부여됩니다. (조직 부여는 하위 상속)</span>
                    </div>

                    <div class="tree" id="treeRoot"></div>
                </section>
            </main>
        </div>
    </div>

    <!-- 비밀번호 변경 모달 (common.js) -->
    <div class="modal-overlay" id="pwModal">
        <div class="modal" style="max-width:420px;">
            <div class="modal-header">
                <h3 class="modal-title">비밀번호 변경</h3>
                <button class="modal-close" id="pwModalClose" type="button">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group"><label class="form-label">현재 비밀번호</label>
                    <input type="password" class="form-input" id="currentPassword"></div>
                <div class="form-group"><label class="form-label">새 비밀번호</label>
                    <input type="password" class="form-input" id="newPassword"></div>
                <div class="form-group"><label class="form-label">새 비밀번호 확인</label>
                    <input type="password" class="form-input" id="confirmPassword"></div>
                <div class="form-error" id="pwError" style="display:none;color:#dc2626;font-size:12px;"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" id="pwModalCancel" type="button">취소</button>
                <button class="btn btn-primary" id="pwModalSave" type="button">변경</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script th:src="@{/js/admin/common.js}" src="/js/admin/common.js"></script>
    <script th:src="@{/js/admin/users.js}" src="/js/admin/users.js"></script>
</body>

</html>
