<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>

        window.deptCodes = /*[[${deptCodes}]]*/ [];

    <style>
        /* dept 탭 — 관리자 테마(네이비 언더라인) */
        .dept-tabs { display: flex; gap: 2px; margin-bottom: 14px; border-bottom: 1px solid var(--color-border); }
        .dept-tab { position: relative; padding: 11px 24px; border: none; background: none; cursor: pointer;
            font-size: 0.9375rem; font-weight: 600; color: var(--color-text-light);
            transition: color var(--transition-fast); }
        .dept-tab:hover { color: var(--color-primary); }
        .dept-tab.active { color: var(--color-primary); }
        .dept-tab.active::after { content: ''; position: absolute; left: 14px; right: 14px; bottom: -1px;
            height: 2.5px; background: var(--color-primary); border-radius: 3px; }

        /* 파티션 탭 — 각 파티션이 탭. 본문 클릭=권한 대상 선택, 연필=이름변경, x=삭제, +=생성 */
        .partition-tabs { display: flex; align-items: flex-end; gap: 2px; flex-wrap: wrap;
            margin-bottom: 16px; border-bottom: 1px solid var(--color-border); }
        .partition-tab { position: relative; display: inline-flex; align-items: center; gap: 6px;
            padding: 10px 14px 10px 16px; border: none; background: none; cursor: pointer;
            font-size: 0.9375rem; font-weight: 600; color: var(--color-text-light);
            transition: color var(--transition-fast); }
        .partition-tab:hover { color: var(--color-primary); }
        .partition-tab.active { color: var(--color-primary); }
        .partition-tab.active::after { content: ''; position: absolute; left: 14px; right: 14px; bottom: -1px;
            height: 2.5px; background: var(--color-primary); border-radius: 3px; }
        .partition-tab .pt-name { white-space: nowrap; }
        .partition-tab .pt-act { display: inline-flex; align-items: center; justify-content: center;
            width: 20px; height: 20px; padding: 0; border: none; background: none; border-radius: 5px;
            color: var(--color-text-muted); opacity: .75; cursor: pointer;
            transition: all var(--transition-fast); }
        .partition-tab .pt-act:hover { opacity: 1; background: var(--base-dark); color: var(--color-primary); }
        .partition-tab .pt-act.pt-del:hover { color: var(--danger, #e5484d); }
        .partition-tab .pt-act svg { width: 13px; height: 13px; }
        .pt-add { display: inline-flex; align-items: center; gap: 5px; margin: 0 0 2px 6px;
            padding: 8px 14px; border: 1px dashed var(--color-border); background: none; cursor: pointer;
            border-radius: 8px; color: var(--color-text-light); font-size: 0.875rem; font-weight: 600;
            transition: all var(--transition-fast); }
        .pt-add:hover { color: var(--color-primary); border-color: var(--color-primary); }
        .pt-add svg { width: 14px; height: 14px; }
        .pt-empty { padding: 10px 6px; color: var(--color-text-muted); font-size: 0.875rem; }

        /* 검색/도구 바 — 문서관리(search-group) 스타일 재사용(master.css) */
        .tree-toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
            padding: 10px; border-bottom: 1px solid var(--color-border); margin-bottom: 12px; }
        .tree-toolbar .search-input { min-width: 220px; }
        .tree-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .tree-actions .btn { display: inline-flex; align-items: center; gap: 6px; }
        .tree-actions .btn svg { width: 14px; height: 14px; }
        /* 안내 캡션(박스 없이 연한 한 줄) */
        .tree-hintbar { display: flex; align-items: center; gap: 6px; margin: 3px 2px 14px; }
        .tree-hintbar svg { width: 14px; height: 14px; color: var(--color-text-muted); flex: 0 0 auto; opacity: .8; }
        .tsub { color: var(--color-text-muted); font-size: 0.8125rem; }

        /* 조직도 트리 */
        .tree { font-size: 0.9375rem; --tree-line: var(--color-border); min-height: 440px;
            padding: 8px 4px 16px; }
        .tree ul { list-style: none; margin: 0; padding-left: 26px; position: relative; }
        .tree > ul { padding-left: 2px; }
        .tree li { position: relative; }
        /* 세로 연결선 */
        .tree ul ul::before { content: ''; position: absolute; left: 12px; top: 0; bottom: 18px;
            width: 1.5px; background: var(--tree-line); border-radius: 2px; }
        /* 가로 연결선 */
        .tree ul ul > li::before { content: ''; position: absolute; left: -14px; top: 20px;
            width: 12px; height: 1.5px; background: var(--tree-line); }
        .collapsed > ul { display: none; }

        .tnode { position: relative; display: flex; align-items: center; gap: 9px; padding: 7px 12px;
            border-radius: 9px; border: 1px solid transparent; transition: background var(--transition-fast),
            border-color var(--transition-fast), box-shadow var(--transition-fast); }
        .tnode:hover { background: rgba(var(--primary-rgb), 0.06); }
        .tnode.hidden { display: none; }

        /* 펼침 토글 */
        .tw-toggle { width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--color-text-muted); border-radius: 6px; font-size: 10px; flex: 0 0 auto;
            transition: all var(--transition-fast); }
        .tw-toggle:not(.leaf):hover { background: var(--color-primary); color: #fff; }
        .tw-toggle.leaf { visibility: hidden; }
        .collapsed > .tnode .tw-toggle { transform: rotate(-90deg); }

        /* 노드 아이콘(조직/사용자 구분) */
        .ticon { width: 22px; height: 22px; flex: 0 0 auto; display: inline-flex; align-items: center;
            justify-content: center; border-radius: 7px; }
        .tnode.part .ticon { background: rgba(var(--primary-rgb), 0.12); color: var(--color-primary); }
        .tnode.user .ticon { background: var(--base-dark); color: var(--color-text-light); }
        .ticon svg { width: 13px; height: 13px; }

        .tnode input[type=checkbox] { width: 17px; height: 17px; cursor: pointer; flex: 0 0 auto;
            accent-color: var(--color-primary); margin: 0; }
        .tnode .tlabel { color: var(--color-text); }
        .tnode.part { padding-top: 8px; padding-bottom: 8px; }
        .tnode.part .tlabel { font-weight: 700; color: var(--color-primary-dark); }
        .tnode .tsub { color: var(--color-text-muted); font-size: 0.8125rem; font-weight: 500; }
        .tnode .tbadge { font-size: 0.6875rem; font-weight: 700; padding: 2px 10px; border-radius: 20px;
            letter-spacing: .02em; background: rgba(var(--primary-rgb), 0.1); color: var(--color-primary); }
        .tnode .tbadge.deny { background: var(--color-error-light); color: var(--color-error); }

        /* 부여 상태 강조 */
        .tnode.granted { background: rgba(var(--primary-rgb), 0.075); border-color: rgba(var(--primary-rgb), 0.22); }
        .tnode.granted::before { content: ''; position: absolute; left: 0; top: 6px; bottom: 6px; width: 3px;
            border-radius: 3px; background: var(--color-primary); }
        .tnode.denied { background: var(--color-error-light); border-color: rgba(var(--color-error-rgb, 220,38,38), 0.2); }
    </style>
</head>

                    </div>
                    <div class="form-group">

            <div class="modal-footer">

        </div>
    </div>

    <!-- 파티션 삭제 확인 모달 -->
    <div class="modal-overlay" id="delConfirmModal">
        <div class="modal" style="max-width:400px;">
            <div class="modal-body" style="padding:32px 24px;">
                <div class="confirm-icon danger">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6" />
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                        <line x1="10" y1="11" x2="10" y2="17" />
                        <line x1="14" y1="11" x2="14" y2="17" />
                    </svg>
                </div>
                <div class="confirm-title">파티션을 삭제하시겠습니까?</div>
                <div class="confirm-msg" id="delConfirmMsg">삭제된 파티션은 복구할 수 없습니다.</div>
            </div>
            <div class="modal-footer" style="justify-content:center;">
                <button class="btn btn-outline" id="delConfirmCancel" type="button">취소</button>
                <button class="btn btn-danger" id="delConfirmOk" type="button">삭제</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <div class="screen-guide-overlay" id="screenGuideOverlay" aria-hidden="true">
        <div class="screen-guide-dim" id="screenGuideDim"></div>
        <div class="screen-guide-highlight-layer" id="screenGuideHighlightLayer"></div>
        <button type="button" class="screen-guide-close-fab" id="btnCloseScreenGuide" aria-label="가이드 닫기">
            닫기
        </button>
    </div>

    <script th:src="@{/js/admin/common.js}" src="/js/admin/common.js"></script>
    <script th:src="@{/js/admin/users.js}" src="/js/admin/users.js"></script>
</body>

</html>
