<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 페이지 · 사용자 부서</title>
    <link rel="stylesheet" th:href="@{/css/admin/base.css}" href="/css/admin/base.css" />
    <link rel="stylesheet" th:href="@{/css/admin/master.css}" href="/css/admin/master.css" />
    <script th:inline="javascript">
        window.deptCodes = /*[[${deptCodes}]]*/ [];
        window.adminName = /*[[${adminName}]]*/ "";
    </script>
    <style>
        /* dept 탭 — 관리자 테마(네이비 언더라인) */
        .dept-tabs { display: flex; gap: 2px; margin-bottom: 18px; border-bottom: 1px solid var(--color-border); }
        .dept-tab { position: relative; padding: 11px 24px; border: none; background: none; cursor: pointer;
            font-size: 0.9375rem; font-weight: 600; color: var(--color-text-light);
            transition: color var(--transition-fast); }
        .dept-tab:hover { color: var(--color-primary); }
        .dept-tab.active { color: var(--color-primary); }
        .dept-tab.active::after { content: ''; position: absolute; left: 14px; right: 14px; bottom: -1px;
            height: 2.5px; background: var(--color-primary); border-radius: 3px; }

        /* 툴바 */
        .tree-toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
        .tree-toolbar .search-input { max-width: 280px; }
        .tsub { color: var(--color-text-muted); font-size: 0.8125rem; }

        /* 조직도 트리 */
        .tree { font-size: 0.9375rem; --tree-line: var(--base-dark); }
        .tree ul { list-style: none; margin: 0; padding-left: 28px; position: relative; }
        .tree > ul { padding-left: 4px; }
        .tree ul ul::before { content: ''; position: absolute; left: 11px; top: 2px; bottom: 16px;
            width: 1px; background: var(--tree-line); }
        .tnode { display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-radius: var(--radius-sm);
            transition: background var(--transition-fast); }
        .tnode:hover { background: rgba(var(--primary-rgb), 0.055); }
        .tnode.hidden { display: none; }
        .tw-toggle { width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--color-text-muted); border-radius: 5px; font-size: 11px; flex: 0 0 auto;
            transition: all var(--transition-fast); }
        .tw-toggle:hover { background: var(--base-dark); color: var(--color-primary); }
        .tw-toggle.leaf { visibility: hidden; }
        .collapsed > .tnode .tw-toggle { transform: rotate(-90deg); }
        .tnode input[type=checkbox] { width: 17px; height: 17px; cursor: pointer; flex: 0 0 auto;
            accent-color: var(--color-primary); }
        .tnode .tlabel { color: var(--color-text); }
        .tnode.part .tlabel { font-weight: 600; color: var(--color-primary-dark); }
        .tnode .tsub { color: var(--color-text-muted); font-size: 0.8125rem; }
        .tnode .tbadge { font-size: 0.6875rem; font-weight: 700; padding: 2px 9px; border-radius: 20px;
            letter-spacing: .02em; background: var(--base-dark); color: var(--color-primary); }
        .tnode .tbadge.deny { background: var(--color-error-light); color: var(--color-error); }
        .collapsed > ul { display: none; }
    </style>
</head>

<body>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="admin-wrapper">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="#" class="sidebar-logo">
                    <div class="sidebar-logo-icon">AT-I</div>
                    <span class="sidebar-logo-text">관리자 페이지</span>
                </a>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section-title">메뉴</div>
                <a th:if="${storage}" href="/admin/storage" class="nav-item" data-page="storage">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                        <polyline points="14 2 14 8 20 8" />
                        <line x1="16" y1="13" x2="8" y2="13" />
                        <line x1="16" y1="17" x2="8" y2="17" />
                    </svg>
                    문서 관리
                </a>
                <a th:if="${statistics}" href="/admin/statistics" class="nav-item" data-page="statistics">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <line x1="18" y1="20" x2="18" y2="10"></line>
                        <line x1="12" y1="20" x2="12" y2="4"></line>
                        <line x1="6" y1="20" x2="6" y2="14"></line>
                    </svg>
                    통계
                </a>
                <a th:if="${master}" href="/admin/master" class="nav-item" data-page="master">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                        <circle cx="9" cy="7" r="4" />
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                        <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                    </svg>
                    계정 관리
                </a>
                <a th:if="${master}" href="/admin/users" class="nav-item active" data-page="users">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                        <circle cx="9" cy="7" r="4" />
                        <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
                        <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                    </svg>
                    사용자 부서
                </a>
                <a href="/admin/guide" class="nav-item" data-page="guide">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                        <path d="M4 4.5A2.5 2.5 0 0 1 6.5 7H20" />
                        <path d="M6.5 17V7" />
                        <path d="M20 22V2" />
                    </svg>
                    가이드
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <div class="sidebar-user-avatar" id="userAvatar">A</div>
                    <div class="sidebar-user-info">
                        <div class="sidebar-user-name" id="userName">admin</div>
                        <div class="sidebar-user-role" th:text="${adminName}">관리자</div>
                    </div>
                    <button class="btn-change-pw" id="btnChangePw" title="비밀번호 변경">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                        </svg>
                    </button>
                    <button class="btn-logout" id="btnLogout" title="로그아웃">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                            <polyline points="16 17 21 12 16 7" />
                            <line x1="21" y1="12" x2="9" y2="12" />
                        </svg>
                    </button>
                </div>
            </div>
        </aside>

        <div class="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="btn-sidebar-toggle" id="btnSidebarToggle">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <line x1="3" y1="12" x2="21" y2="12" />
                            <line x1="3" y1="6" x2="21" y2="6" />
                            <line x1="3" y1="18" x2="21" y2="18" />
                        </svg>
                    </button>
                    <div class="breadcrumb">
                        <a href="#">홈</a>
                        <span class="breadcrumb-sep">›</span>
                        <span class="breadcrumb-current">사용자 부서</span>
                    </div>
                </div>
                <div class="topbar-right">
                    <div class="session-timer">
                        <span class="session-timer-label">세션 만료까지</span>
                        <span class="session-timer-value" id="sessionTimer"
                            th:attr="data-remaining=${sessionRemainingSeconds}" data-remaining="0">00:00:00</span>
                        <span class="session-timer-note" id="sessionTimerNote"></span>
                        <button type="button" class="session-timer-refresh" id="sessionTimerRefresh">연장</button>
                    </div>
                </div>
            </header>

            <main class="page-body">
                <section class="table-card" style="position:relative;">
                    <div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div></div>

                    <div class="dept-tabs" id="deptTabs"></div>

                    <div class="tree-toolbar">
                        <input type="text" class="search-input" id="treeSearch" placeholder="이름 / 아이디 검색…">
                        <button class="btn btn-outline btn-sm" id="btnExpandAll" type="button">모두 펼치기</button>
                        <button class="btn btn-outline btn-sm" id="btnCollapseAll" type="button">모두 접기</button>
                        <span style="flex:1"></span>
                        <span class="tsub" id="treeHint">조직·사용자에 체크하면 접근 권한이 부여됩니다 · 조직 부여는 하위 상속</span>
                    </div>

                    <div class="tree" id="treeRoot"></div>
                </section>
            </main>
        </div>
    </div>

    <!-- 비밀번호 변경 모달 -->
    <div class="modal-overlay" id="pwModal">
        <div class="modal" style="max-width:420px;">
            <div class="modal-header">
                <h3 class="modal-title">비밀번호 변경</h3>
                <button class="modal-close" id="pwModalClose" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <form id="pwForm">
                    <div class="form-group">
                        <label class="form-label">현재 비밀번호 <span class="required">*</span></label>
                        <input type="password" class="form-input" id="currentPassword" placeholder="현재 비밀번호를 입력하세요">
                    </div>
                    <div class="form-group">
                        <label class="form-label">새 비밀번호 <span class="required">*</span></label>
                        <input type="password" class="form-input" id="newPassword" placeholder="새 비밀번호를 입력하세요">
                    </div>
                    <div class="form-group">
                        <label class="form-label">새 비밀번호 확인 <span class="required">*</span></label>
                        <input type="password" class="form-input" id="confirmPassword" placeholder="새 비밀번호를 다시 입력하세요">
                    </div>
                    <div class="pw-error" id="pwError" style="display:none;"></div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" id="pwModalCancel" type="button">취소</button>
                <button class="btn btn-primary" id="pwModalSave" type="button">변경</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script th:src="@{/js/admin/common.js}" src="/js/admin/common.js"></script>
    <script th:src="@{/js/admin/users.js}" src="/js/admin/users.js"></script>
</body>

</html>
