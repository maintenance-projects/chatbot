<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 페이지</title>
    <link rel="stylesheet" th:href="@{/css/admin/base.css}" href="/css/admin/base.css" />
    <link rel="stylesheet" th:href="@{/css/admin/master.css}" href="/css/admin/master.css" />
</head>

<body>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="admin-wrapper">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="#" class="sidebar-logo">
                    <div class="sidebar-logo-icon">AT-I</div>
                    <span class="sidebar-logo-text">관리자 페이지</span>
                </a>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section-title">메뉴</div>
                <a th:if="${storage}" href="/admin/storage" class="nav-item" data-page="storage">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                        <polyline points="14 2 14 8 20 8" />
                        <line x1="16" y1="13" x2="8" y2="13" />
                        <line x1="16" y1="17" x2="8" y2="17" />
                        <polyline points="10 9 9 9 8 9" />
                    </svg>
                    문서 관리
                </a>
                <a th:if="${statistics}" href="/admin/statistics" class="nav-item" data-page="statistics">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <line x1="18" y1="20" x2="18" y2="10"></line>
                        <line x1="12" y1="20" x2="12" y2="4"></line>
                        <line x1="6" y1="20" x2="6" y2="14"></line>
                    </svg>
                    통계
                </a>
                <a th:if="${master}" href="#" class="nav-item active" data-page="master">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                        <circle cx="9" cy="7" r="4" />
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                        <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                    </svg>
                    계정 관리
                </a>
                <a th:if="${master}" href="/admin/users" class="nav-item" data-page="users">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                        <circle cx="9" cy="7" r="4" />
                        <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
                        <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                    </svg>
                    사용자 부서
                </a>
                <a href="/admin/guide" class="nav-item" data-page="guide">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                        <path d="M4 4.5A2.5 2.5 0 0 1 6.5 7H20" />
                        <path d="M6.5 17V7" />
                        <path d="M20 22V2" />
                    </svg>
                    가이드
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <div class="sidebar-user-avatar" id="userAvatar">A</div>
                    <div class="sidebar-user-info">
                        <div class="sidebar-user-name" id="userName">admin</div>
                        <div class="sidebar-user-role" th:text="${adminName}">관리자</div>
                    </div>
                    <button class="btn-change-pw" id="btnChangePw" title="비밀번호 변경">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                        </svg>
                    </button>
                    <button class="btn-logout" id="btnLogout" title="로그아웃">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                            <polyline points="16 17 21 12 16 7" />
                            <line x1="21" y1="12" x2="9" y2="12" />
                        </svg>
                    </button>
                </div>
            </div>
        </aside>

        <div class="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="btn-sidebar-toggle" id="btnSidebarToggle">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <line x1="3" y1="12" x2="21" y2="12" />
                            <line x1="3" y1="6" x2="21" y2="6" />
                            <line x1="3" y1="18" x2="21" y2="18" />
                        </svg>
                    </button>
                    <div class="breadcrumb">
                        <a href="#">홈</a>
                        <span class="breadcrumb-sep">›</span>
                        <span class="breadcrumb-current">계정 관리</span>
                    </div>
                </div>
                <div class="topbar-right">
                    <button type="button" class="btn btn-outline btn-sm btn-screen-guide" id="btnScreenGuide">
                        화면 가이드
                    </button>
                    <div class="session-timer">
                        <span class="session-timer-label">세션 만료까지</span>
                        <span class="session-timer-value" id="sessionTimer"
                            th:attr="data-remaining=${sessionRemainingSeconds}"
                            data-remaining="0">00:00:00</span>
                        <span class="session-timer-note" id="sessionTimerNote"></span>
                        <button type="button" class="session-timer-refresh" id="sessionTimerRefresh">연장</button>
                    </div>
                </div>
            </header>

            <main class="page-body">
                <section class="stats-row">
                    <div class="stat-card">
                        <div class="stat-icon blue">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                                <circle cx="9" cy="7" r="4" />
                                <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                                <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                            </svg>
                        </div>
                        <div class="stat-info">
                            <div class="stat-label">전체 계정</div>
                            <div class="stat-value" id="statTotal">0</div>
                        </div>
                    </div>
                </section>

                <section class="table-card" style="position:relative;">
                    <div class="loading-overlay" id="loadingOverlay">
                        <div class="spinner"></div>
                    </div>

                    <div class="toolbar">
                        <div class="toolbar-left">
                            <div class="search-group">
                                <select class="search-select" id="searchField">
                                    <option value="adminId">관리자 ID</option>
                                    <option value="adminName">관리자명</option>
                                </select>
                                <input type="text" class="search-input" id="searchInput" placeholder="검색어를 입력하세요…">
                                <button class="btn-search" id="btnSearch" title="검색">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                        stroke-linecap="round" stroke-linejoin="round">
                                        <circle cx="11" cy="11" r="8" />
                                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <div class="toolbar-right">
                            <button class="btn btn-primary" id="btnAddAdmin" type="button">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="12" y1="5" x2="12" y2="19" />
                                    <line x1="5" y1="12" x2="19" y2="12" />
                                </svg>
                                계정 추가
                            </button>
                        </div>
                    </div>

                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th style="width:60px;" class="center">No</th>
                                    <th class="center">관리자 ID</th>
                                    <th class="center">관리자명</th>
                                    <th style="width:140px;" class="center">IP</th>
                                    <th style="width:80px;" class="center">문서</th>
                                    <th style="width:80px;" class="center">통계</th>
                                    <th style="width:80px;" class="center">마스터</th>
                                    <th style="width:140px;" class="center">등록일</th>
                                    <th style="width:100px;" class="center">관리</th>
                                </tr>
                            </thead>
                            <tbody id="adminTableBody"></tbody>
                        </table>
                    </div>

                    <div class="table-footer">
                        <div class="table-info" id="tableInfo"></div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <!-- 추가/수정 모달 -->
    <div class="modal-overlay" id="adminModal">
        <div class="modal" style="max-width:480px;">
            <div class="modal-header">
                <h3 class="modal-title" id="adminModalTitle">계정 추가</h3>
                <button class="modal-close" id="adminModalClose" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <form id="adminForm">
                    <div class="form-group">
                        <label class="form-label">관리자 ID <span class="required">*</span></label>
                        <input type="text" class="form-input" id="inputAdminId" placeholder="관리자 ID를 입력하세요" maxlength="50">
                    </div>
                    <div class="form-group">
                        <label class="form-label">관리자명 <span class="required">*</span></label>
                        <input type="text" class="form-input" id="inputAdminName" placeholder="관리자명을 입력하세요" maxlength="50">
                    </div>
                    <div class="form-group" id="passwordGroup">
                        <label class="form-label">비밀번호 <span class="required">*</span></label>
                        <input type="password" class="form-input" id="inputPassword" placeholder="비밀번호를 입력하세요" maxlength="50">
                    </div>
                    <div class="form-group">
                        <label class="form-label">접속 IP</label>
                        <input type="text" class="form-input" id="inputIp" placeholder="0.0.0.0 (전체 허용)" maxlength="50">
                    </div>
                    <div class="form-group">
                        <label class="form-label">권한 설정</label>
                        <div class="auth-checkboxes">
                            <label class="auth-checkbox">
                                <input type="checkbox" id="chkStorage">
                                <span>문서 관리</span>
                            </label>
                            <label class="auth-checkbox">
                                <input type="checkbox" id="chkStatistics">
                                <span>통계</span>
                            </label>
                            <label class="auth-checkbox">
                                <input type="checkbox" id="chkMaster">
                                <span>계정 관리</span>
                            </label>
                        </div>
                    </div>
                    <div class="form-error" id="formError" style="display:none;"></div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" id="adminModalCancel" type="button">취소</button>
                <button class="btn btn-primary" id="adminModalSave" type="button">저장</button>
            </div>
        </div>
    </div>

    <!-- 삭제 확인 모달 -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal" style="max-width:400px;">
            <div class="modal-body" style="padding:32px 24px;">
                <div class="confirm-icon danger">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6" />
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                        <line x1="10" y1="11" x2="10" y2="17" />
                        <line x1="14" y1="11" x2="14" y2="17" />
                    </svg>
                </div>
                <div class="confirm-title" id="confirmTitle">계정을 삭제하시겠습니까?</div>
                <div class="confirm-msg" id="confirmMsg">삭제된 계정은 복구할 수 없습니다.</div>
            </div>
            <div class="modal-footer" style="justify-content:center;">
                <button class="btn btn-outline" id="confirmCancel" type="button">취소</button>
                <button class="btn btn-danger" id="confirmOk" type="button"
                    style="background:var(--danger);color:#fff;border-color:var(--danger);">삭제</button>
            </div>
        </div>
    </div>

    <!-- 비밀번호 변경 모달 -->
    <div class="modal-overlay" id="pwModal">
        <div class="modal" style="max-width:420px;">
            <div class="modal-header">
                <h3 class="modal-title">비밀번호 변경</h3>
                <button class="modal-close" id="pwModalClose" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <form id="pwForm">
                    <div class="form-group">
                        <label class="form-label">현재 비밀번호 <span class="required">*</span></label>
                        <input type="password" class="form-input" id="currentPassword" placeholder="현재 비밀번호를 입력하세요">
                    </div>
                    <div class="form-group">
                        <label class="form-label">새 비밀번호 <span class="required">*</span></label>
                        <input type="password" class="form-input" id="newPassword" placeholder="새 비밀번호를 입력하세요">
                    </div>
                    <div class="form-group">
                        <label class="form-label">새 비밀번호 확인 <span class="required">*</span></label>
                        <input type="password" class="form-input" id="confirmPassword" placeholder="새 비밀번호를 다시 입력하세요">
                    </div>
                    <div class="pw-error" id="pwError" style="display:none;"></div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" id="pwModalCancel" type="button">취소</button>
                <button class="btn btn-primary" id="pwModalSave" type="button">변경</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <div class="screen-guide-overlay" id="screenGuideOverlay" aria-hidden="true">
        <div class="screen-guide-dim" id="screenGuideDim"></div>
        <div class="screen-guide-highlight-layer" id="screenGuideHighlightLayer"></div>
        <button type="button" class="screen-guide-close-fab" id="btnCloseScreenGuide" aria-label="가이드 닫기">
            닫기
        </button>
    </div>

    <script th:src="@{/js/admin/common.js}" src="/js/admin/common.js"></script>
    <script th:src="@{/js/admin/master.js}" src="/js/admin/master.js"></script>
</body>

</html>
