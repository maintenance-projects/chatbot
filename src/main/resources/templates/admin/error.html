<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>접근 오류</title>
    <script th:src="@{/jquery/jquery-3.7.1.min.js}" src="/jquery/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/admin/base.css}" href="/css/admin/base.css" />
    <link rel="stylesheet" th:href="@{/css/admin/error.css}" href="/css/admin/error.css" />
</head>

<body>
    <div class="error-container">
        <div class="error-card">
            <div class="error-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10" />
                    <line x1="12" y1="8" x2="12" y2="12" />
                    <line x1="12" y1="16" x2="12.01" y2="16" />
                </svg>
            </div>

            <div class="error-content">
                <h1 class="error-code" id="errorCode">403</h1>
                <h2 class="error-title">잘못된 접근입니다</h2>
                <p class="error-description" id="errorDescription">
                    요청하신 페이지에 접근할 수 없습니다.<br>
                    권한이 없거나 유효하지 않은 요청입니다.
                </p>
            </div>

            <div class="error-actions">
                <button type="button" class="btn btn-primary" id="btnGoLogin">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                        <polyline points="10 17 15 12 10 7" />
                        <line x1="15" y1="12" x2="3" y2="12" />
                    </svg>
                    <span>로그인 페이지로</span>
                </button>
                <button type="button" class="btn btn-secondary" id="btnGoBack">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12" />
                        <polyline points="12 19 5 12 12 5" />
                    </svg>
                    <span>이전 페이지</span>
                </button>
            </div>

            <div class="error-info">
                <p>문제가 지속되면 관리자에게 문의하세요.</p>
            </div>
        </div>

        <footer class="error-footer">
            <p>&copy; 2026 Admin System. All rights reserved.</p>
        </footer>
    </div>

    <script th:src="@{/js/admin/error.js}" src="/js/admin/error.js"></script>
    <script th:src="@{/js/admin/common.js}" src="/js/admin/common.js"></script>
</body>

</html>
