<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 페이지</title>
    <link rel="stylesheet" th:href="@{/css/admin/base.css}" href="/css/admin/base.css" />
    <link rel="stylesheet" th:href="@{/css/admin/storage.css}" href="/css/admin/storage.css" />

    <script th:inline="javascript">
        const countList = JSON.parse(/*[[${countList}]]*/ "[]");
    </script>
</head>

<body>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="admin-wrapper">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="#" class="sidebar-logo">
                    <div class="sidebar-logo-icon">AT-I</div>
                    <span class="sidebar-logo-text">관리자 페이지</span>
                </a>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section-title">메뉴</div>
                <a href="#" class="nav-item active" data-page="storage">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                        <polyline points="14 2 14 8 20 8" />
                        <line x1="16" y1="13" x2="8" y2="13" />
                        <line x1="16" y1="17" x2="8" y2="17" />
                        <polyline points="10 9 9 9 8 9" />
                    </svg>
                    문서 관리
                </a>
                <a href="#" class="nav-item" data-page="chat">
                    <svg width="24px" height="24px" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="feather feather-bar-chart-2">
                        <line x1="18" y1="20" x2="18" y2="10"></line>
                        <line x1="12" y1="20" x2="12" y2="4"></line>
                        <line x1="6" y1="20" x2="6" y2="14"></line>
                    </svg>
                    통계
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <div class="sidebar-user-avatar" id="userAvatar">A</div>
                    <div class="sidebar-user-info">
                        <div class="sidebar-user-name" id="userName">admin</div>
                        <div class="sidebar-user-role">관리자</div>
                    </div>
                    <button class="btn-logout" id="btnLogout" title="로그아웃">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                            <polyline points="16 17 21 12 16 7" />
                            <line x1="21" y1="12" x2="9" y2="12" />
                        </svg>
                    </button>
                </div>
            </div>
        </aside>

        <div class="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="btn-sidebar-toggle" id="btnSidebarToggle">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <line x1="3" y1="12" x2="21" y2="12" />
                            <line x1="3" y1="6" x2="21" y2="6" />
                            <line x1="3" y1="18" x2="21" y2="18" />
                        </svg>
                    </button>
                    <div class="breadcrumb">
                        <a href="#">홈</a>
                        <span class="breadcrumb-sep">›</span>
                        <span class="breadcrumb-current">문서 관리</span>
                    </div>
                </div>
            </header>

            <main class="page-body">
                <section class="stats-row">
                    <div class="stat-card">
                        <div class="stat-icon blue">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                                <polyline points="14 2 14 8 20 8" />
                            </svg>
                        </div>
                        <div class="stat-info">
                            <div class="stat-label">전체 문서</div>
                            <div class="stat-value" id="statTotal">0</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon purple">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
                            </svg>
                        </div>
                        <div class="stat-info">
                            <div class="stat-label">오늘 업로드</div>
                            <div class="stat-value" id="statToday">0</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon green">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                                <polyline points="22 4 12 14.01 9 11.01" />
                            </svg>
                        </div>
                        <div class="stat-info">
                            <div class="stat-label">활성 문서</div>
                            <div class="stat-value" id="statActive">0</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon red">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path
                                    d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
                                <line x1="12" y1="9" x2="12" y2="13" />
                                <line x1="12" y1="17" x2="12.01" y2="17" />
                            </svg>
                        </div>
                        <div class="stat-info">
                            <div class="stat-label">비활성 문서</div>
                            <div class="stat-value" id="statInactive">0</div>
                        </div>
                    </div>
                </section>

                <section class="table-card" style="position:relative;">
                    <div class="loading-overlay" id="loadingOverlay">
                        <div class="spinner"></div>
                    </div>

                    <div class="toolbar">
                        <div class="toolbar-left">
                            <div class="search-group">
                                <select class="search-select" id="searchField">
                                    <option value="fileName">문서명</option>
                                    <option value="adminName">등록자</option>
                                </select>
                                <input type="text" class="search-input" id="searchInput" placeholder="검색어를 입력하세요…">
                                <button class="btn-search" id="btnSearch" title="검색">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                        stroke-linecap="round" stroke-linejoin="round">
                                        <circle cx="11" cy="11" r="8" />
                                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                                    </svg>
                                </button>
                            </div>
                            <div class="sort-group">
                                <select class="sort-select" id="sortField">
                                    <option value="fileName">문서명</option>
                                    <option value="registDate" selected>등록일</option>
                                </select>
                                <button class="btn-sort" id="btnSort" title="정렬 변경" type="button">
                                    <svg class="sort-icon-svg" id="sortIconSvg" viewBox="0 0 24 24" fill="none"
                                        stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <path d="M12 5v14" />
                                        <path d="M19 12l-7 7-7-7" />
                                    </svg>
                                    <span id="sortLabel">내림차순</span>
                                </button>
                            </div>
                        </div>
                        <div class="toolbar-right">
                            <button class="btn btn-primary" id="btnAddDoc" type="button">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="12" y1="5" x2="12" y2="19" />
                                    <line x1="5" y1="12" x2="19" y2="12" />
                                </svg>
                                문서 추가
                            </button>
                        </div>
                    </div>

                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th style="width:80px;" class="center">No</th>
                                    <th class="center">문서명</th>
                                    <th style="width:120px;" class="center">파일형식</th>
                                    <th style="width:120px;" class="center">용량</th>
                                    <th style="width:120px;" class="center">등록자</th>
                                    <th style="width:140px;" class="center">등록일</th>
                                    <th style="width:120px;" class="center">상태</th>
                                    <th style="width:80px;" class="center">관리</th>
                                </tr>
                            </thead>
                            <tbody id="docTableBody"></tbody>
                        </table>
                    </div>

                    <div class="table-footer">
                        <div class="table-info" id="tableInfo"></div>
                        <div style="display:flex;align-items:center;gap:12px;">
                            <div style="display:flex;align-items:center;gap:6px;">
                                <span style="font-size:0.82rem;color:var(--text-light);">표시</span>
                                <select class="per-page-select" id="perPageSelect">
                                    <option value="10">10</option>
                                    <option value="20">20</option>
                                    <option value="50">50</option>
                                </select>
                            </div>
                            <div class="pagination" id="pagination"></div>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <div class="modal-overlay" id="docModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="docModalTitle">문서 추가</h3>
                <button class="modal-close" id="docModalClose" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <form id="docForm">
                    <div class="form-group">
                        <label class="form-label">등록자 <span class="required">*</span></label>
                        <input type="text" class="form-input" id="docUploader" readonly disabled>
                    </div>
                    <div class="form-group" id="fileUploadGroup">
                        <label class="form-label">파일 첨부 <span class="required">*</span></label>
                        <div class="file-upload-area" id="fileUploadArea">
                            <input type="file" id="fileInput"
                                accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.png,.jpg,.jpeg,.gif">
                            <div class="file-upload-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                                    <polyline points="17 8 12 3 7 8" />
                                    <line x1="12" y1="3" x2="12" y2="15" />
                                </svg>
                            </div>
                            <div class="file-upload-text">클릭하여 파일 선택 또는 <strong>드래그 앤 드롭</strong></div>
                            <div class="file-upload-hint">PDF, DOC, XLS, PPT, TXT, 이미지 (최대 50MB)</div>
                        </div>
                        <div id="filePreviewWrap"></div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" id="docModalCancel" type="button">취소</button>
                <button class="btn btn-primary" id="docModalSave" type="button">업로드</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="confirmModal">
        <div class="modal" style="max-width:400px;">
            <div class="modal-body" style="padding:32px 24px;">
                <div class="confirm-icon danger">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6" />
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                        <line x1="10" y1="11" x2="10" y2="17" />
                        <line x1="14" y1="11" x2="14" y2="17" />
                    </svg>
                </div>
                <div class="confirm-title" id="confirmTitle">문서를 삭제하시겠습니까?</div>
                <div class="confirm-msg" id="confirmMsg">삭제된 문서는 복구할 수 없습니다.</div>
            </div>
            <div class="modal-footer" style="justify-content:center;">
                <button class="btn btn-outline" id="confirmCancel" type="button">취소</button>
                <button class="btn btn-danger" id="confirmOk" type="button"
                    style="background:var(--danger);color:#fff;border-color:var(--danger);">삭제</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script th:src="@{/js/admin/common.js}" src="/js/admin/common.js"></script>
    <script th:src="@{/js/admin/storage.js}" src="/js/admin/storage.js"></script>
</body>

</html>
