<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <title>첨부파일 검색</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script th:src="@{/js/lib/marked.min.js}"></script>
    <script th:src="@{/js/sse-client.js}"></script>
    <script th:src="@{/js/filesearch.js}"></script>
    <script th:inline="javascript">
        window.invokeId = /*[[${invokeId}]]*/ "";
    </script>
    <style>
        :root {
            --fs-bg: #f4f5f7; --fs-panel: #ffffff; --fs-line: #e5e7eb;
            --fs-primary: #2563eb; --fs-text: #1f2937; --fs-sub: #6b7280;
            --fs-user: #2563eb; --fs-bot: #f3f4f6;
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
            background: var(--fs-bg); color: var(--fs-text); }
        .fs-shell { max-width: 760px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column;
            background: var(--fs-panel); border-left: 1px solid var(--fs-line); border-right: 1px solid var(--fs-line); }
        .fs-head { padding: 14px 18px; border-bottom: 1px solid var(--fs-line); display: flex; align-items: center; gap: 10px; }
        .fs-head h1 { font-size: 16px; margin: 0; font-weight: 700; }
        .fs-head .fs-sub { font-size: 12px; color: var(--fs-sub); }
        .fs-files { padding: 10px 18px; border-bottom: 1px solid var(--fs-line); display: flex; flex-wrap: wrap;
            gap: 8px; align-items: center; }
        .fs-chip { font-size: 12px; padding: 5px 10px; border-radius: 14px; border: 1px solid var(--fs-line);
            background: #fff; cursor: pointer; color: var(--fs-text); }
        .fs-chip.is-active { background: var(--fs-primary); color: #fff; border-color: var(--fs-primary); }
        .fs-chip.empty { color: var(--fs-sub); cursor: default; }
        .fs-btn { font-size: 12px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--fs-line);
            background: #fff; cursor: pointer; }
        .fs-btn.primary { background: var(--fs-primary); color: #fff; border-color: var(--fs-primary); }
        .fs-btn:disabled { opacity: .5; cursor: not-allowed; }
        .fs-body { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
        .fs-msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.55;
            white-space: pre-wrap; word-break: break-word; }
        .fs-msg.user { align-self: flex-end; background: var(--fs-user); color: #fff; }
        .fs-msg.bot { align-self: flex-start; background: var(--fs-bot); }
        .fs-msg.bot .fs-refs { margin-top: 8px; padding-top: 8px; border-top: 1px dashed #d1d5db; font-size: 12px; color: var(--fs-sub); }
        .fs-refs a { color: var(--fs-primary); text-decoration: none; }
        .fs-progress { align-self: flex-start; font-size: 12px; color: var(--fs-sub); }
        .fs-foot { border-top: 1px solid var(--fs-line); padding: 12px 18px; }
        .fs-target { font-size: 12px; color: var(--fs-sub); margin-bottom: 6px; min-height: 16px; }
        .fs-inputbar { display: flex; gap: 8px; align-items: flex-end; }
        .fs-input { flex: 1; resize: none; border: 1px solid var(--fs-line); border-radius: 10px; padding: 10px;
            font-size: 14px; font-family: inherit; max-height: 120px; }
        .fs-hidden { display: none; }
    </style>
</head>

<body>
    <main class="fs-shell">
        <header class="fs-head">
            <h1>첨부파일 검색</h1>
            <span class="fs-sub">인덱싱된 첨부파일에서 내용을 검색합니다.</span>
        </header>

        <section class="fs-files" id="fsFiles">
            <span class="fs-chip empty">불러오는 중…</span>
        </section>
        <section class="fs-files" style="border-bottom:1px solid var(--fs-line)">
            <button class="fs-btn" id="fsUploadBtn" type="button">＋ 첨부파일 업로드</button>
            <button class="fs-btn" id="fsRefreshBtn" type="button">↻ 목록 새로고침</button>
            <input type="file" id="fsFileInput" class="fs-hidden" />
        </section>

        <section class="fs-body" id="fsBody"></section>

        <footer class="fs-foot">
            <div class="fs-target" id="fsTarget">검색할 파일을 위에서 선택하세요.</div>
            <div class="fs-inputbar">
                <textarea class="fs-input" id="fsInput" rows="1" placeholder="선택한 첨부파일에 대해 질문하세요."></textarea>
                <button class="fs-btn primary" id="fsSend" type="button">전송</button>
            </div>
        </footer>
    </main>
</body>

</html>
