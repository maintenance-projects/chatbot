<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- PKB 본문(헤더 제외) — 독립 화면(/mypkb)과 챗봇 임베드가 공유. AI 챗봇과 동일 UI(색만 다름) -->
<th:block th:fragment="content">
    <!-- 대화 내용 검색바(헤더 검색버튼으로 토글) -->
    <div class="p-searchbar" id="pSearchBar" hidden>
        <input class="p-inp grow" id="pSearchbarInput" type="text" placeholder="대화에서 검색" autocomplete="off" />
        <span class="p-searchbar__meta" id="pSearchMeta">0 / 0</span>
        <button class="p-searchbar__nav" id="pSearchPrev" type="button" aria-label="이전">▲</button>
        <button class="p-searchbar__nav" id="pSearchNext" type="button" aria-label="다음">▼</button>
        <button class="p-searchbar__close" id="pSearchbarClose" type="button" aria-label="닫기">×</button>
    </div>

    <!-- 대화방(검색 Q&A). 안내 말풍선은 pkb.js가 생성(시간·복사 포함) -->
    <div class="p-chatwrap">
        <div class="p-chat" id="pChat">
            <div class="p-divider"><span>오늘</span></div>
        </div>
    </div>

    <!-- 하단 입력(＋도구메뉴 + 검색입력 + 검색) -->
    <div class="p-footer">
        <div class="p-inputwrap">
            <button class="p-plus" id="pPlusBtn" type="button" aria-label="추가">＋</button>
            <div class="p-menu" id="pMenu" aria-hidden="true">
                <button class="p-menu__item" id="pIngestBtn" type="button">＋ 첨부파일 추가 (AI 분석)</button>
                <button class="p-menu__item" id="pFilesBtn" type="button">📁 내 파일</button>
            </div>
            <input type="file" id="pFileInput" class="hidden" />
            <input class="p-inp grow" id="pSearchInput" type="text" placeholder="검색어를 입력하세요" />
            <button class="p-send" id="pSearchBtn" type="button">검색</button>
        </div>
    </div>

    <!-- 내 파일 목록 패널(오버레이) -->
    <div class="p-files" id="pFilesPanel" aria-hidden="true">
        <div class="p-files__head">
            <span class="p-files__title">내 파일</span>
            <button class="p-files__close" id="pFilesClose" type="button">×</button>
        </div>
        <div class="p-files__note" id="pFilesNote" hidden></div>
        <div class="p-files__filters">
            <input class="p-inp" id="pFilterCategory" type="text" placeholder="카테고리 필터" />
            <input class="p-inp" id="pFilterTag" type="text" placeholder="태그 필터" />
            <button class="p-btn" id="pApplyFilter" type="button">적용</button>
            <button class="p-btn" id="pRefresh" type="button">↻</button>
        </div>
        <div class="p-files__body">
            <div class="p-cards" id="pCards"></div>
            <div class="p-empty hidden" id="pCardsEmpty">저장된 파일이 없습니다.</div>
            <button class="p-more" id="pMoreBtn" type="button" hidden>더 보기</button>
        </div>
    </div>

    <!-- 상세 모달 -->
    <div class="p-modal" id="pModal">
        <div class="p-modal__box">
            <button class="p-modal__close" id="pModalClose" type="button">×</button>
            <div id="pModalBody"></div>
        </div>
    </div>

    <!-- 이용 안내 모달 -->
    <div class="p-modal" id="pGuide">
        <div class="p-modal__box">
            <button class="p-modal__close" id="pGuideClose" type="button">×</button>
            <h3>📎 AI 첨부파일 검색 이용 안내</h3>
            <div class="v" style="margin-top:8px">
                <p><b>＋ 첨부파일 추가</b> 또는 대화창에 파일을 끌어다 놓으면 AI가 파일을 분석·인덱싱합니다.</p>
                <p style="margin-top:10px"><b>자연어 검색</b> — 하단 입력창에 물어보세요.<br />
                    예) "지난주 받은 계약서 요약해줘", "세금 관련 파일 찾아줘"</p>
                <p style="margin-top:10px"><b>내 파일</b>(＋ 메뉴)에서 목록·카테고리/태그 필터·상세·삭제를 할 수 있습니다.</p>
                <p style="margin-top:10px">첨부파일은 업로드 후 일정 기간(보관일수) 뒤 자동 삭제되며, 내 파일 목록에서 남은 일수를 확인할 수 있습니다.</p>
            </div>
        </div>
    </div>

    <!-- 삭제 확인 모달 -->
    <div class="p-modal" id="pConfirm">
        <div class="p-modal__box p-confirm__box">
            <div class="p-confirm__title">파일 삭제</div>
            <div class="p-confirm__msg" id="pConfirmMsg"></div>
            <div class="p-confirm__acts">
                <button class="p-btn" id="pConfirmCancel" type="button">취소</button>
                <button class="p-btn p-btn--danger" id="pConfirmOk" type="button">삭제</button>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
