<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오류 안내</title>
    <style>
        body {
            margin: 0;
            font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
            background: #f5f7fb;
            color: #1f2937;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
        }
        .error-card {
            width: 100%;
            max-width: 560px;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 28px 24px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
            text-align: center;
        }
        .error-title {
            margin: 0 0 8px;
            font-size: 24px;
            font-weight: 700;
        }
        .error-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            color: #f59e0b;
        }
        .error-message {
            margin: 0 0 20px;
            color: #4b5563;
            line-height: 1.6;
        }
        .error-code {
            margin: 0;
            color: #9ca3af;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <main class="error-card">
        <div class="error-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                <line x1="12" y1="9" x2="12" y2="13"></line>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
        </div>
        <h1 class="error-title">잘못된 접근입니다.</h1>
        <p class="error-message">
            요청하신 페이지에 접근할 수 없습니다.<br>
            주소를 확인하시거나 관리자에게 문의해 주세요.
        </p>
        <p class="error-code" th:if="${status != null}" th:text="'오류 코드: ' + ${status}">오류 코드: 500</p>
    </main>
</body>
</html>
