<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>ULTARI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <link rel="stylesheet" th:href="@{/css/dialog.css}" />

    <script th:src="@{/jquery/jquery-3.7.1.min.js}"></script>
    <script th:src="@{/js/dialog.js}"></script>

    <script th:inline="javascript">
        const sessionId = /*[[${sessionId}]]*/ "";
        const tempList = JSON.parse(/*[[${templateList}]]*/ "[]");
        window.sessionId = sessionId;
        window.templateList = tempList;
    </script>
</head>

<body>
    <main class="cb-page">
        <section class="cb-shell" aria-label="챗봇 상담">
            <aside class="cb-widget is-open" id="cbWidget" aria-hidden="false">
                <header class="cb-header">
                    <div class="cb-header__left">
                        <div class="cb-brand">
                            <div class="cb-brand__logo">C</div>
                            <div class="cb-brand__text">
                                <div class="cb-brand__title">ULTARI</div>
                                <div class="cb-brand__sub">챗봇 상담</div>
                            </div>
                        </div>
                    </div>

                    <div class="cb-header__right">
                        <button class="cb-iconbtn" id="cbSearchBtn" type="button" aria-label="검색" aria-expanded="false">
                            <img src="/img/ic-search.png" alt="" />
                        </button>
                    </div>
                </header>

                <div class="cb-searchbar" id="cbSearchBar" aria-hidden="true">
                    <div class="cb-searchbar__inner">
                        <input class="cb-searchbar__input" id="cbSearchInput" type="text" placeholder="대화에서 검색"
                            autocomplete="off" />
                        <div class="cb-searchbar__meta" id="cbSearchMeta">0 / 0</div>
                        <button class="cb-searchbar__nav" id="cbSearchPrev" type="button" aria-label="이전">
                            <img src="/img/ic-up.png" alt="이전" />
                        </button>
                        <button class="cb-searchbar__nav" id="cbSearchNext" type="button" aria-label="다음">
                            <img src="/img/ic-down.png" alt="다음" />
                        </button>
                        <button class="cb-searchbar__close" id="cbSearchClose" type="button" aria-label="닫기">
                            <img src="/img/ic-close.png" alt="닫기" />
                        </button>
                    </div>
                </div>

                <section class="cb-body" id="cbBody">
                    <div class="cb-divider"><span>오늘</span></div>

                    <div class="cb-msg cb-msg--bot">
                        <div class="cb-avatar">
                            <img class="cb-avatar__img" src="/img/ic-chatbot.png" alt="챗봇" />
                        </div>
                        <div class="cb-bubble">
                            <div class="cb-bubble__text">안녕하세요! 무엇을 도와드릴까요?</div>
                            <div class="cb-meta"></div>
                        </div>
                    </div>
                </section>

                <footer class="cb-footer" id="cbFooter">
                    <div class="cb-inputwrap" id="cbInputWrap">
                        <textarea class="cb-input" id="cbInput" placeholder="메시지를 입력해주세요."
                            autocomplete="off"></textarea>

                        <div class="cb-inputbar">
                            <div class="cb-actions">
                                <button class="cb-plus" id="cbPlus" type="button" aria-label="추가 메뉴"
                                    aria-expanded="false">＋</button>

                                <div class="cb-pop" id="cbPop" role="menu" aria-hidden="true">
                                    <button class="cb-pop__item" id="cbActionUpload" type="button" role="menuitem">
                                        <img class="cb-avatar__img" src="/img/ic-file.png" alt="첨부파일" />
                                        <span class="cb-pop__text">첨부파일 추가</span>
                                    </button>
                                    <button class="cb-pop__item" id="cbActionPrint" type="button" role="menuitem">
                                        <img class="cb-avatar__img" src="/img/ic-print.png" alt="인쇄" />
                                        <span class="cb-pop__text">대화 인쇄</span>
                                    </button>
                                    <button class="cb-pop__item" id="cbActionUpResearch" type="button" role="menuitem">
                                        <img class="cb-avatar__img" src="/img/ic-research.png" alt="광역 리서치" />
                                        <span class="cb-pop__text">광역 리서치</span>
                                    </button>
                                    <button class="cb-pop__item" id="cbActionSelect" type="button" role="menuitem">
                                        <img class="cb-avatar__img" src="/img/ic-select.png" alt="양식 선택" />
                                        <span class="cb-pop__text">양식 선택</span>
                                    </button>
                                </div>
                            </div>

                            <button class="cb-send" id="cbSend" type="button" aria-label="전송">➤</button>
                        </div>

                        <input id="cbFileInput" type="file" hidden />
                    </div>

                    <section class="cb-tray" id="cbTplTray" aria-hidden="true">
                        <div class="cb-tray__head">
                            <div class="cb-tray__title">
                                <img src="/img/ic-select.png" alt="" />
                                <span>양식 선택</span>
                            </div>
                            <button class="cb-tray__close" id="cbTplTrayClose" type="button" aria-label="닫기">×</button>
                        </div>

                        <div class="cb-tray__body" id="cbTplTrayBody" data-render="tpl"></div>
                    </section>
                </footer>
            </aside>
        </section>
    </main>
</body>

</html>
