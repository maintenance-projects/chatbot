<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>ULTARI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <link rel="stylesheet" th:href="@{/css/dialog.css}" />

    <script th:src="@{/jquery/jquery-3.7.1.min.js}"></script>
    <script th:src="@{/js/dialog.js}"></script>

    <script th:inline="javascript">
        const sessionId = /*[[${sessionId}]]*/ "";
        const tempList = JSON.parse(/*[[${templateList}]]*/ "[]");
        window.sessionId = sessionId;
        window.templateList = tempList;
    </script>
</head>

<body>
    <main class="cb-page">
        <section class="cb-shell" id="cbShell" aria-label="챗봇 상담">
            <aside class="cb-widget is-open" id="cbWidget" aria-hidden="false">
                <header class="cb-header">
                    <div class="cb-header__left">
                        <div class="cb-brand">
                            <div class="cb-brand__logo">A</div>
                            <div class="cb-brand__text">
                                <div class="cb-brand__title">AT-I</div>
                                <!-- <div class="cb-brand__sub">챗봇 상담</div> -->
                            </div>
                        </div>
                    </div>

                    <div class="cb-header__right">
                        <button class="cb-iconbtn cb-pop__item_top" id="cbActionPrint" type="button" role="menuitem" data-tooltip="인쇄">
                            <svg style="color: #ffffff; width: 20px; height: 20px;" width="24px" height="24px"
                                viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                class="feather feather-printer">
                                <polyline points="6 9 6 2 18 2 18 9"></polyline>
                                <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2">
                                </path>
                                <rect x="6" y="14" width="12" height="8"></rect>
                            </svg>
                        </button>
                        <button class="cb-iconbtn cb-pop__item_top" id="cbSearchBtn" type="button" aria-label="검색" aria-expanded="false"
                            data-tooltip="검색">
                            <svg style="color: #ffffff; width: 20px; height: 20px;" viewBox="0 0 24 24"
                                xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" class="feather feather-search">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                        </button>
                    </div>
                </header>

                <div class="cb-searchbar" id="cbSearchBar" aria-hidden="true">
                    <div class="cb-searchbar__inner">
                        <input class="cb-searchbar__input" id="cbSearchInput" type="text" placeholder="대화에서 검색"
                            autocomplete="off" />
                        <div class="cb-searchbar__meta" id="cbSearchMeta">0 / 0</div>
                        <button class="cb-searchbar__nav" id="cbSearchPrev" type="button" aria-label="이전">
                            <img src="/img/ic-up.png" alt="이전" />
                        </button>
                        <button class="cb-searchbar__nav" id="cbSearchNext" type="button" aria-label="다음">
                            <img src="/img/ic-down.png" alt="다음" />
                        </button>
                        <button class="cb-searchbar__close" id="cbSearchClose" type="button" aria-label="닫기">
                            <img src="/img/ic-close.png" alt="닫기" />
                        </button>
                    </div>
                </div>

                <section class="cb-body" id="cbBody">
                    <div class="cb-divider"><span>오늘</span></div>

                    <div class="cb-msg cb-msg--bot">
                        <!-- <div class="cb-avatar">
                            <img class="cb-avatar__img" src="/img/ic-chatbot.png" alt="챗봇" />
                        </div> -->
                        <div class="cb-bubble">
                            <div class="cb-bubble__text">
                                <pre data-rawtext="안녕하세요! 무엇을 도와드릴까요?">안녕하세요! 무엇을 도와드릴까요?</pre>
                            </div>
                            <div class="cb-meta"></div>
                            <div class="cb-actionsbar" aria-hidden="true">
                                <button class="cb-actbtn cb-actbtn--copy" type="button" aria-label="복사">
                                    <img src="/img/ic-copy.png" alt="복사" />
                                </button>
                            </div>
                        </div>
                    </div>
                </section>

                <footer class="cb-footer" id="cbFooter">
                    <div class="cb-inputwrap" id="cbInputWrap">
                        <textarea class="cb-input" id="cbInput" placeholder="메시지를 입력해주세요."
                            autocomplete="off"></textarea>

                        <div class="cb-inputbar">
                            <div class="cb-actions">
                                <!-- <button class="cb-plus" id="cbPlus" type="button" aria-label="추가 메뉴"
                                    aria-expanded="false">＋</button> -->
                            </div>

                            <button class="cb-send" id="cbSend" type="button" aria-label="전송">
                                전송
                            </button>
                        </div>

                        <input id="cbFileInput" type="file" hidden />
                    </div>

                    <div class="tool-menu" id="tool-menu" role="menu" aria-hidden="true">

                        <!-- 문서 업로드 -->
                        <button class="cb-pop__item" id="cbActionUpload" type="button" role="menuitem"
                            data-tooltip="문서 업로드">
                            <svg width="16px" height="16px" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="feather feather-upload-cloud">
                                <polyline points="16 16 12 12 8 16"></polyline>
                                <line x1="12" y1="12" x2="12" y2="21"></line>
                                <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"></path>
                                <polyline points="16 16 12 12 8 16"></polyline>
                            </svg>
                        </button>

                        <!-- 문서함 -->
                        <button class="cb-pop__item" id="cbDocsBtn" type="button" role="menuitem" data-tooltip="문서함">
                            <svg width="16px" height="16px" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="feather feather-hash">
                                <line x1="4" y1="9" x2="20" y2="9"></line>
                                <line x1="4" y1="15" x2="20" y2="15"></line>
                                <line x1="10" y1="3" x2="8" y2="21"></line>
                                <line x1="16" y1="3" x2="14" y2="21"></line>
                            </svg>
                        </button>

                        <!-- 양식 선택 -->
                        <button class="cb-pop__item" id="cbActionSelect" type="button" role="menuitem"
                            data-tooltip="양식 선택">
                            <svg width="16px" height="16px" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="feather feather-file-minus">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                                <line x1="9" y1="15" x2="15" y2="15"></line>
                            </svg>
                        </button>

                        <!-- 지난 대화 보기 -->
                        <!-- <button class="cb-pop__item" id="cbActionLast" type="button" role="menuitem"
                            data-tooltip="지난 대화 보기">
                            <svg width="16px" height="16px" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="feather feather-message-square">
                                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                            </svg>
                        </button> -->

                        <!-- 공유 -->
                        <!-- <button class="cb-pop__item" id="cbActionSharing" type="button" role="menuitem"
                            data-tooltip="공유">
                            <svg width="16px" height="16px" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="feather feather-share-2">
                                <circle cx="18" cy="5" r="3"></circle>
                                <circle cx="6" cy="12" r="3"></circle>
                                <circle cx="18" cy="19" r="3"></circle>
                                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                            </svg>
                        </button> -->
                    </div>

                    <section class="cb-tray" id="cbTplTray" aria-hidden="true">
                        <div class="cb-tray__head">
                            <div class="cb-tray__title">
                                <span>양식 선택</span>
                            </div>
                            <button class="cb-tray__close" id="cbTplTrayClose" type="button" aria-label="닫기">×</button>
                        </div>

                        <div class="cb-tray__body" id="cbTplTrayBody" data-render="tpl"></div>
                    </section>
                </footer>
            </aside>

            <section class="cb-viewer" id="cbViewer" aria-hidden="true">
                <header class="cb-viewer__head">
                    <div class="cb-viewer__title">미리보기</div>
                    <button class="cb-viewer__close" id="cbViewerClose" type="button" aria-label="닫기">×</button>
                </header>
                <iframe class="cb-viewer__frame" id="cbViewerFrame" title="문서 미리보기"></iframe>
            </section>
        </section>
    </main>
</body>

</html>
