<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <title>AI 첨부파일 비서 (PKB)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" th:href="@{/css/pkb.css}" href="/css/pkb.css" />
    <script th:src="@{/js/lib/marked.min.js}"></script>
    <script th:src="@{/js/sse-client.js}"></script>
    <script th:src="@{/js/pkb.js}"></script>
    <script th:inline="javascript">
        window.ownerId = /*[[${ownerId}]]*/ "";
    </script>
    <style>
        /* 독립 화면 레이아웃(임베드와 분리) */
        body { margin: 0; background: var(--p-bg); }
        .p-shell { max-width: 900px; margin: 0 auto; min-height: 100vh;
            border-left: 1px solid var(--p-line); border-right: 1px solid var(--p-line); }
    </style>
</head>

<body>
    <main class="p-shell">
        <header class="p-head">
            <h1>AI 첨부파일 비서</h1>
            <span class="sub">개인 지식 저장소 · 첨부파일을 AI가 분석·검색합니다.</span>
        </header>
        <th:block th:replace="~{fragments/pkb-body :: content}"></th:block>
    </main>
</body>

</html>
