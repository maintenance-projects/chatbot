<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <title>AI 첨부파일 비서 (PKB)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script th:src="@{/js/lib/marked.min.js}"></script>
    <script th:src="@{/js/sse-client.js}"></script>
    <script th:src="@{/js/pkb.js}"></script>
    <script th:inline="javascript">
        window.ownerId = /*[[${ownerId}]]*/ "";
    </script>
    <style>
        :root {
            --p-bg: #f4f5f7; --p-panel: #fff; --p-line: #e5e7eb; --p-primary: #6d28d9;
            --p-text: #1f2937; --p-sub: #6b7280; --p-chip: #ede9fe;
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
            background: var(--p-bg); color: var(--p-text); }
        .p-shell { max-width: 900px; margin: 0 auto; min-height: 100vh; background: var(--p-panel);
            border-left: 1px solid var(--p-line); border-right: 1px solid var(--p-line); }
        .p-head { padding: 16px 20px; border-bottom: 1px solid var(--p-line); display: flex; align-items: center; gap: 10px; }
        .p-head h1 { font-size: 17px; margin: 0; font-weight: 700; }
        .p-head .sub { font-size: 12px; color: var(--p-sub); }
        .p-sec { padding: 16px 20px; border-bottom: 1px solid var(--p-line); }
        .p-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .p-btn { font-size: 13px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--p-line);
            background: #fff; cursor: pointer; }
        .p-btn.primary { background: var(--p-primary); color: #fff; border-color: var(--p-primary); }
        .p-btn:disabled { opacity: .5; cursor: not-allowed; }
        .p-inp { font-size: 13px; padding: 8px 10px; border: 1px solid var(--p-line); border-radius: 8px; }
        .p-inp.grow { flex: 1; min-width: 160px; }
        .p-title { font-size: 13px; font-weight: 700; color: var(--p-sub); margin-bottom: 10px; }
        /* 검색 결과 */
        .p-analysis { font-size: 12px; color: var(--p-sub); margin: 8px 0; }
        .p-answer { font-size: 14px; line-height: 1.6; }
        .p-refs { margin-top: 8px; font-size: 12px; color: var(--p-sub); }
        /* 카드 */
        .p-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
        .p-card { border: 1px solid var(--p-line); border-radius: 10px; padding: 12px; background: #fff; }
        .p-card .name { font-size: 13px; font-weight: 700; margin-bottom: 4px; word-break: break-all; }
        .p-card .sum { font-size: 12px; color: var(--p-sub); line-height: 1.45; max-height: 54px; overflow: hidden; }
        .p-card .meta { font-size: 11px; color: var(--p-sub); margin-top: 6px; }
        .p-tags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
        .p-tag { font-size: 11px; background: var(--p-chip); color: var(--p-primary); padding: 2px 7px; border-radius: 10px; }
        .p-card .acts { margin-top: 8px; display: flex; gap: 6px; }
        .p-card .acts button { font-size: 11px; padding: 4px 8px; border: 1px solid var(--p-line); border-radius: 6px;
            background: #fff; cursor: pointer; }
        .p-empty { font-size: 13px; color: var(--p-sub); padding: 8px 0; }
        /* 모달 */
        .p-modal { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: center;
            justify-content: center; padding: 20px; }
        .p-modal.open { display: flex; }
        .p-modal__box { background: #fff; border-radius: 12px; max-width: 520px; width: 100%; max-height: 80vh;
            overflow-y: auto; padding: 20px; }
        .p-modal__box h3 { margin: 0 0 10px; font-size: 15px; word-break: break-all; }
        .p-modal__box .k { font-size: 12px; color: var(--p-sub); margin-top: 10px; }
        .p-modal__box .v { font-size: 13px; line-height: 1.5; }
        .p-modal__close { float: right; cursor: pointer; border: none; background: none; font-size: 18px; color: var(--p-sub); }
        .hidden { display: none; }
    </style>
</head>

<body>
    <main class="p-shell">
        <header class="p-head">
            <h1>AI 첨부파일 비서</h1>
            <span class="sub">개인 지식 저장소 · 첨부파일을 AI가 분석·검색합니다.</span>
            <select id="pDeptSwitch" class="p-inp" title="AI 파티션 선택" hidden style="margin-left:auto"></select>
        </header>

        <!-- 자연어 검색 -->
        <section class="p-sec">
            <div class="p-title">자연어 검색</div>
            <div class="p-row">
                <input class="p-inp grow" id="pSearchInput" type="text"
                    placeholder="예) 지난주 받은 계약서 요약해줘 / 세금 관련 파일 찾아줘" />
                <button class="p-btn primary" id="pSearchBtn" type="button">검색</button>
            </div>
            <div id="pSearchResult"></div>
        </section>

        <!-- 인제스트 + 필터 -->
        <section class="p-sec">
            <div class="p-row">
                <button class="p-btn" id="pIngestBtn" type="button">＋ 첨부파일 추가(AI 분석)</button>
                <input type="file" id="pFileInput" class="hidden" />
                <span style="flex:1"></span>
                <input class="p-inp" id="pFilterCategory" type="text" placeholder="카테고리 필터" />
                <input class="p-inp" id="pFilterTag" type="text" placeholder="태그 필터" />
                <button class="p-btn" id="pApplyFilter" type="button">적용</button>
                <button class="p-btn" id="pRefresh" type="button">↻</button>
            </div>
            <div id="pIngestStatus" class="p-analysis"></div>
        </section>

        <!-- 내 파일 -->
        <section class="p-sec" style="border-bottom:none">
            <div class="p-title">내 파일</div>
            <div class="p-cards" id="pCards"></div>
            <div class="p-empty hidden" id="pCardsEmpty">저장된 파일이 없습니다.</div>
        </section>
    </main>

    <!-- 상세 모달 -->
    <div class="p-modal" id="pModal">
        <div class="p-modal__box">
            <button class="p-modal__close" id="pModalClose" type="button">×</button>
            <div id="pModalBody"></div>
        </div>
    </div>
</body>

</html>
