<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>챗봇 로그인</title>
    <link rel="stylesheet" th:href="@{/css/chatbot-login.css}" href="/css/chatbot-login.css" />
    <script th:src="@{/jquery/jquery-3.7.1.min.js}" src="/jquery/jquery-3.7.1.min.js"></script>
</head>

<body>
    <div class="login-shell">
        <div class="login-card">
            <div class="login-head">
                <div class="login-logo">AT-I</div>
                <h1>챗봇 로그인</h1>
                <p>사용자 아이디와 비밀번호를 입력해 주세요.</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-row">
                    <label for="userId">아이디</label>
                    <input id="userId" type="text" autocomplete="username" placeholder="아이디 입력" required>
                </div>
                <div class="form-row">
                    <label for="password">비밀번호</label>
                    <input id="password" type="password" autocomplete="current-password" placeholder="비밀번호 입력" required>
                </div>
                <button type="submit" class="login-btn">
                    <span class="btn-text">로그인</span>
                    <span class="btn-loader" style="display:none;">처리중...</span>
                </button>
                <div id="errorMessage" class="login-error" style="display:none;">
                    <span></span>
                </div>
            </form>
        </div>
    </div>

    <script th:inline="javascript">
        window.loginError = /*[[${error}]]*/ "";
    </script>
    <script th:src="@{/js/chatbot-login.js}" src="/js/chatbot-login.js"></script>
</body>

</html>
